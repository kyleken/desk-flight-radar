; Desk Flight Radar – Waveshare ESP32-C6-Touch-LCD-2.8
; Build:  pio run          Flash:  pio run -t upload
[env:radar]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  https://github.com/lovyan03/LovyanGFX.git#1.2.36
  https://github.com/bblanchon/ArduinoJson.git#v7.4.3
build_src_flags = -Wall -Wextra -Wno-unused-parameter -Wno-missing-field-initializers
